<!-- My Playlist Sorter(HTML)
Outline:
You will build a playlist sorter page that uses all four array methods on a single page. The page has three Bootstrap cards — one for sorting song names A to Z and Z to A, one for sorting play counts from least to most and most to least, and one for labelling every play count with the word 'plays'. -->




<!-- Steps(Javascript & HTML & CSS):- -->
<!-- 
Step 1: Open a new HTML file and add the basic HTML structure -DOCTYPE, html, head, and body tags.

Step 2: In the head section, paste the Bootstrap 4.3.1 CDN link. Inside a style block, add three rules: body background: lavender; }, h1, h3 { color: darkviolet; }, and .box { background: white; color: darkviolet; }.

Step 3: Inside the body, add a div with class="container py-4". Inside it, add an h1 heading 'My Playlist Sorter' with class="mb-1" and a paragraph subtitle with class="text-muted mb-4".

Step 4: Add the Song Names Bootstrap card: a div with class="card mb-4", a card-body inside, an h3 with card-title 'Song Names', two buttons with class="btn btn-primary"- Sort A to Z (onclick="sortAZ()") and Sort Z to A (onclick="sortZA()")- and a div with id="nameResult" and class="box p-3 mt-3 rounded".

Step 5: Add the Play Counts Bootstrap card the same way: h3 'Play Counts', two buttons - Least Played First (onclick="sortLeast()") and Most Played First (onclick="sortMost()") - and a div with id="countResult" and class="box p-3 mt-3 rounded".

Step 6: Add the Label Every Play Count Bootstrap card: h3 'Label Every Play Count, one button -Add Plays Label (onclick="addLabel()")- and a div with id="labelResult" and class="box p-3 mt-3 rounded".

Step 7: Add a script tag at the bottom of the body. Declare the songs array as ['Zoom', 'Bounce', "Glow','Rush', "Spark'] and the plays array as [320, 85, 210, 50, 175]. Set the initial innerHTML for all three result divs -'Songs: ' + songs, 'Plays: ' + plays, and 'Press the button above!'.

Step 8: Write the five functions: 'sortAZ()' using songs.sort(), 'sortZA()' using songs.sort() then songs.reverse(), 'sortLeast()' using plays.sort(function(a,b)(return a-b;}), 'sortMost()' using plays.sort(function(a,b){return b-a;}), and 'addLabel()' using plays.map(function(c){return c+' plays"}). Save and test all five buttons. -->
