<!-- CSS : Cascade styling sheets 
 Inline Styling: Its used when we write style directly inside a HTML tag.
 Internal Styling: We write all the CSS rules inside a <style ></style> tag in the <head></head> section of the HTML file.
 Note: When using the styling whatever is on the left side is known as properties and on the right side are values. e.g.: color: blue., here color is the property and blue is value.

 Selectors: 
 1.Universal : These selectors use '*' and when its used, then the styling will be applied to each and every tag. 
 2.Element : They use the name of elements to provide styling, like h1,p, etc.
 3.Class : They style a group of elements that share the same class name, it uses '.' followed by the class name. e.g.: .class1
 4.ID : It styles just one unique element on the page, no two elements can have same ID, it uses '#' followed by the class name, e.g. #id1



-->

<!-- You will create a personal webpage called My Colour Card. The page has a heading, a short tagline, an About Me card with four detail lines, and a Favourite Things section. Students style the page using all five CSS methods covered in the lesson. -->

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Colour Card</title>
      
     <style>
     h2   {color: blue;}

     #heading2{color: blueviolet;
    
    font-size: 40px; ;
           }

                }
     
     
     
     
     </style>
       
  </head>

    <h1 style="color: aqua;" >My Colour Card</h1>
    <p>Hi! This is my very own webpage.</p>

  </body>
