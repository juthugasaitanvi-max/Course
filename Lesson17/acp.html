
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf4ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1746a2;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        #eventPass {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 8px;
            text-align: center;
        }

        #passNumber {
            font-size: 24px;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Event Registration</h1>

        <form id="registrationForm">

            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Enter your age">

            <label for="event">Choose Event</label>
            <select id="event">
                <option value="">-- Select an Event --</option>
                <option value="Coding Competition">Coding Competition</option>
                <option value="Quiz Competition">Quiz Competition</option>
                <option value="Science Exhibition">Science Exhibition</option>
                <option value="Art Competition">Art Competition</option>
            </select>

            <button type="submit">Register</button>

        </form>

        <div id="message"></div>

        <div id="eventPass">
            <h2>🎉 Event Pass Generated!</h2>
            <p>Student: <span id="passName"></span></p>
            <p>Event: <span id="passEvent"></span></p>
            <p>Your Pass Number:</p>
            <div id="passNumber"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById("registrationForm");
        const message = document.getElementById("message");
        const eventPass = document.getElementById("eventPass");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const studentName = document.getElementById("studentName").value.trim();
            const email = document.getElementById("email").value.trim();
            const age = Number(document.getElementById("age").value);
            const selectedEvent = document.getElementById("event").value;

            eventPass.style.display = "none";

            // Validation
            if (studentName === "") {
                message.textContent = "Please enter your name.";
                message.style.color = "red";
                return;
            }

            if (email === "") {
                message.textContent = "Please enter your email.";
                message.style.color = "red";
                return;
            }

            if (age < 5 || age > 100 || isNaN(age)) {
                message.textContent = "Please enter a valid age.";
                message.style.color = "red";
                return;
            }

            if (selectedEvent === "") {
                message.textContent = "Please select an event.";
                message.style.color = "red";
                return;
            }

            message.textContent = "Registration successful! Generating your pass...";
            message.style.color = "green";

            setTimeout(function() {

                const randomPass = Math.floor(100000 + Math.random() * 900000);

                document.getElementById("passName").textContent = studentName;
                document.getElementById("passEvent").textContent = selectedEvent;
                document.getElementById("passNumber").textContent = randomPass;

                eventPass.style.display = "block";

                message.textContent = "Your event pass is ready!";

            }, 1500);
        });
    </script>

</body>
</html>
