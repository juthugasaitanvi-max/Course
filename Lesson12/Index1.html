<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ice Cream Store </title>
</head>
<body>
    <h1>Welcome to my Ice cream store!!</h1>
    <p>We Serve the best ice cream!!</p>

   <div id="Ice_cream">
    <div class="Flavour">Flavour1:<span id="flavour1"></span></div>
    <div class="Flavour">Flavour2:<span id="flavour2"></span></div>
    <div class="Flavour">Flavour3:<span id="flavour3"></span></div>
    <div class="Flavour">Flavour4:<span id="flavour4"></span></div>
   </div>
   <br>
   
   <button onclick="Openflavours()">Click to view flavours</button>
   <p id="flavour-status"></p>

  <script>

     function Openflavours(){
    document.getElementById("flavour1").innerHTML="Dark Chocolate" 
    document.getElementById("flavour2").innerHTML="Mystic Vanilla" 
    document.getElementById("flavour3").innerHTML="Strawberry Delight" 
    document.getElementById("flavour4").innerHTML="Blubbery Fantasy" 
     }   



















  </script>

</body>
</html>
