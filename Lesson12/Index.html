<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Zoo</title>

    <style>

body{
    font-family:italic ;
    background: peachpuff;
    text-align: center;
    padding:30px;
    font-weight: bold;

}

h1{
    color:darkgreen;
}

#zoo{
    border:1px solid darkgreen;
    width: 300px;
    margin: 16px auto;
    padding: 12px;
    border-radius: 10px;
    background: white;
}

.zone{
    border:1px solid darkgreen;
     margin: 6px 0;
    padding: 8px 12px;
    border-radius: 6px;
    text-align: left;
}

button{
    background: #fff05f;
    color:white;
    padding:10px 24px;
    border:none;
    border-radius: 20px;
    cursor: pointer;
}


    </style>
</head>    
<body>
      <h1>My Zoo!</h1>
      <p>Using JS and the DOM to add animals to each cage!</p>

      <div id="zoo">
        <div class="zone">Zone 1:<span id="zone1"></span></div>
        <div class="zone">Zone 2:<span id="zone2"></span></div>
        <div class="zone">Zone 3:<span id="zone3"></span></div>
        <div class="zone">Zone 4:<span id="zone4"></span></div>
        <div class="zone">Total:<span id="total"></span></div>
      </div>
      <br>

      <button onclick="openZoo()">Open the Zooo!</button>
      <p id="zoo-status"></p>


<script>

    function openZoo(){
 document.getElementById("zone1").innerHTML="Tiger"
document.getElementById("zone2").innerHTML="Eagle"
document.getElementById("zone3").innerHTML="Peacock"
document.getElementById("zone4").innerHTML="Lion"
document.getElementById("total").innerHTML=4

document.getElementById("zoo").style.backgroundColor="lightgreen"
document.getElementById("zoo-status").innerHTML=document.title+" is now OPEN!!!!!!"
    }





</script>

</body>
</html>
