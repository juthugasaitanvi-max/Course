<!-- Creating a JavaScript object, defining key:value properties, reading values with dot notation, reading values with
bracket notation, and updating the page using document.getElementByld() and .textContent.

STEPS
Step 1: Open a new file called my-phone-contact.html.
Step 2: Add the HTML boilerplate (DOCTYPE, html, head, body) and paste the Bootstrap 5 CDN link inside the
<head> tag.
Step 3: Add an <h1> heading reading "My Phone Contact" and a short subtitle paragraph.
Step 4: Build a Bootstrap card with four list items - one each for name, phone, school, and city. Give each its
own id: id="name", id="phone", id="school", id="city".
Step 5: Add a second Bootstrap card below to act as a code display box with id="codeDisplay".
Step 6: Inside a <script> tag at the bottom of <body>, create var myContact = { } with 4 properties: name,
phone, school, city.
Step 7: Use document.getElementByld() and dot notation to display myContact.name and myContact.phone in
the matching elements.
Step 8: Use document.getElementByld() and bracket notation to display myContact["school"] and
myContact["city"] in the matching elements. -->

<h1>My Phone Contact</h1>

    </div>

         let phone_contact={
    name:"Saitanvi",

}

let name=document.getElementById("name").textContent=phone_contact.name

let school=document.getElementById("school").textContent=phone_contact.school_name

code.textContent= 'let phone_contact = {\n' +
      '  name:   "' + phone_contact.name + '",\n' +

</script>
</body>
</html>
