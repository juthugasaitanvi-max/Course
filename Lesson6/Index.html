<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Superhero Card</title>

    <style>

      body{background-color: darkblue;
            color: white;          
      }  
     
      h1{color:yellow;
         text-shadow: 2px 2px orange;
         
      }
    
      .tagline{text-transform: capitalize;
               font-size: 20px;
      } 

     h2{font-weight: bold;
        text-decoration: underline;
        color: green;
     }

     .powers{font-weight: bold;
             color: lightgreen;
     }

     .badge{font-size: 30px;
            font-weight: bold;
            color: gold;
            transform: rotate(15deg);
     }
     


    
    </style>


</head>
<body>
    <h1>Wonder Woman</h1>
     <p class="tagline" >She is a powerful superhero from the land of Themyscira.</p>       
     <h2>POWERS</h2>
     <p class="powers" > Super Strength </p>     
     <p class="powers" >Flight </p>
     <h2>WEAKNESSES</h2>
     <p class="weaknesses" ><s>Vulnerability to bullets</s></p>
     <p class="badge" >Badge:Top Hero</p>





</body>
</html>

<!-- In this activity,You will build a superhero profile card for your very own hero. The page has a dark blue background, a giant yellow title with an orange shadow, a tagline that transforms to Title Case, section headings in UPPERCASE with underlines, bold green powers, crossed-out weaknesses, and a tilted gold badge. -->
