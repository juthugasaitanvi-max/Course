<!-- My Planet Cards
Outline:
You will build a Planet Cards page using a JavaScript class. The page has a button — Show Planets! — and three card areas. When you click the button, a showPlanets() function runs. It creates three Planet objects and fills each card with the planet name and a fun fact using innerHTML.

STEPS:

. Step 1: Create the HTML structure - add an h1 heading, a short paragraph, a button, and three divs with
ids card1, card2, and card3.
. Step 2: Add a <script> tag and write the Planet class inside it with an opening and closing curly brace.
. Step 3: Inside the class, write the constructor with name and fact as parameters. Use this.name and
this.fact to save both values.
. Step 4: Still inside the class, write the describe() method. It should return this.name + ": " + this.fact.
. Step 5: Outside the class, write the showPlanets() function. Inside it, create three Planet objects - Earth,
Mars, and Saturn - using new Planet().
. Step 6: Use document.getElementByld() and innerHTML to display each planet as a card inside card1,
card2, and card3. Call p1.describe() to show the fact.
. Step 7: Connect the button - add onclick="showPlanets()" to the button tag.
. Step 8: Run your page and click Show Planets! - all three planet cards should appear.-->
